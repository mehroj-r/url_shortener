upstream web {
    server web:8000;
}

server {
    listen 1050;
    server_name url.mekhroj.com www.url.mekhroj.com;
    client_max_body_size 1M;

    # Requests arrive from the host's reverse proxy through Docker's network.
    # Trust X-Forwarded-For from private addresses only, so $remote_addr becomes
    # the real visitor IP (it is passed on to Django as X-Real-IP).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://web;

        # No upstream keep-alive: idle kept-alive connections make gunicorn
        # wait out its whole graceful timeout on every deploy
        proxy_set_header   Connection close;

        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Forwarded-Proto https;
    }

}
