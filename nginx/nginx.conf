upstream web {
    server web:8000;
}

server {
    listen 1050;
    server_name url.mekhroj.com www.url.mekhroj.com;
    client_max_body_size 1M;

    # Requests arrive from the host's reverse proxy through Docker's network.
    # Trust X-Forwarded-For from private addresses only, so $remote_addr becomes
    # the real visitor IP (it is passed on to Django as X-Real-IP).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    # The web app (frontend/), built into the image
    location = / {
        return 302 /app/;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        root /usr/share/nginx;
        try_files $uri /app/index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }

    # File names carry a content hash, so they can be cached for good
    location /app/assets/ {
        root /usr/share/nginx;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://web;

        # No upstream keep-alive: idle kept-alive connections make gunicorn
        # wait out its whole graceful timeout on every deploy
        proxy_set_header   Connection close;

        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Forwarded-Proto https;
    }

}
