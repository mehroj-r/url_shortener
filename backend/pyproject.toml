[project]
name = "urlshortener"
version = "0.1.26"
description = "Self-hosted, invite-only link shortener with collections, tags, expiring short codes and click analytics, built on Django REST Framework and React."
license = "MIT"
authors = [{ name = "Mehroj Majidov" }]
keywords = ["url-shortener", "link-shortener", "short-links", "click-analytics", "django", "django-rest-framework", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "django-phonenumber-field[phonenumbers]>=8.5.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt[crypto]>=5.5.1",
    "drf-nested-routers>=0.95.3",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "python-decouple>=3.8",
    "sentry-sdk[django]>=2.72.0",
    "ua-parser>=1.0.2",
    "whitenoise>=6.12.0",
]

[project.urls]
Repository = "https://github.com/mehroj-r/url-shortener"
Issues = "https://github.com/mehroj-r/url-shortener/issues"

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-extensions>=4.1",
    "django-query-analyzer>=0.0.17",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
# Tests run without collectstatic, so WhiteNoise finds no STATIC_ROOT
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["src/apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "DJ"]
# DJ001: nullable username/user agent are deliberate; W292/DJ012: existing code style
ignore = ["DJ001", "DJ012", "W292"]

[tool.ruff.lint.per-file-ignores]
"src/config/settings/*.py" = ["F403", "F405"]
"src/*/admin/__init__.py" = ["F403"]
"src/apps/*/admin/__init__.py" = ["F403"]
