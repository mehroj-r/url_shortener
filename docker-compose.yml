services:
  db:
    container_name: url-shortener-db
    image: postgres:18.6-alpine
    volumes:
      # Postgres 18+ keeps its data in a versioned subdirectory (18/docker)
      - db_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5400:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    container_name: url-shortener-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend/src:/app
    ports:
      - "127.0.0.1:8005:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  db_data:
