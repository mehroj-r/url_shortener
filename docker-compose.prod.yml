services:
  db:
    container_name: url-shortener-db-prod
    image: postgres:18.6-alpine
    ports:
        - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      # Postgres 18+ keeps its data in a versioned subdirectory (18/docker)
      - db_data:/var/lib/postgresql
    networks:
      - url_shortener_net
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    container_name: url-shortener-web-prod
    build: .
    entrypoint: /app/scripts/entrypoint.sh
    command: gunicorn config.wsgi:application --config python:config.gunicorn
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - url_shortener_net
    restart: unless-stopped
    stop_grace_period: 35s
    env_file:
      - .env

  nginx:
    container_name: url-shortener-nginx-prod
    build: nginx
    ports:
      - "127.0.0.1:1050:1050"
    volumes:
      - static_files:/app/staticfiles:ro
    depends_on:
      - web
    networks:
      - url_shortener_net
    restart: unless-stopped

volumes:
  db_data:
  static_files:

networks:
  url_shortener_net:
    driver: bridge
