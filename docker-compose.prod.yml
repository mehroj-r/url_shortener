services:
  db:
    container_name: url-shortener-db-prod
    image: postgres:18.6-alpine
    ports:
        - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      # Postgres 18+ keeps its data in a versioned subdirectory (18/docker)
      - db_data:/var/lib/postgresql
    networks:
      - url_shortener_net
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    container_name: url-shortener-web-prod
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Set by the deploy job to the release it published
        APP_VERSION: ${APP_VERSION:-dev}
    entrypoint: /app/scripts/entrypoint.sh
    command: gunicorn config.wsgi:application --config python:config.gunicorn
    ports:
      # The host's reverse proxy forwards here (TLS ends there)
      - "127.0.0.1:1050:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - url_shortener_net
    restart: unless-stopped
    stop_grace_period: 35s
    env_file:
      - .env

volumes:
  db_data:

networks:
  url_shortener_net:
    driver: bridge
