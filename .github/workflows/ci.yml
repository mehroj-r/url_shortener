name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: url_shortener_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Check for missing migrations
        run: uv run python src/manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

  release:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The tags, to find the last release
          fetch-depth: 0

      # master only takes pull requests, so the version isn't committed back.
      # Each deploy is a tag and a GitHub release on the merge commit instead
      - name: Publish the next release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(python3 -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')
          last=$(git tag --list 'v*' --sort=-version:refname | head -1)
          last=${last#v}
          if [ -n "$last" ] && [ "$(printf '%s\n' "$last" "$current" | sort -V | tail -1)" != "$last" ]; then
            # Set by hand in pyproject.toml, e.g. a minor bump
            version=$current
          else
            IFS=. read -r major minor patch <<< "${last:-$current}"
            version="$major.$minor.$((patch + 1))"
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes
          echo "version=$version" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_VERSION: ${{ needs.release.outputs.version }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_VERSION
          script: |
            set -e
            cd url_shortener
            git pull --ff-only origin master

            # Builds first, then replaces only the containers that changed.
            # APP_VERSION goes into the image (Sentry release, VERSION file)
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
